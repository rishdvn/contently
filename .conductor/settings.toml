"$schema" = "https://conductor.build/schemas/settings.schema.json"

# Committed, shared by every workspace. Secrets never go here — they come from
# the cloud environment (Settings → Organization → Cloud Computer) or, locally,
# from .conductor/settings.local.toml, which is gitignored.

[scripts]
setup = ".conductor/setup.sh"

# Local workspaces each get their own port, so several can serve the app at
# once. Cloud workspaces have a VM each and no $CONDUCTOR_PORT at all, so they
# fall back to 3000; without the fallback, `next dev --port` fails for want of
# a value. Anything that drives a browser must resolve the port the same way.
[scripts.run.dev]
command = "npm run dev -- --port ${CONDUCTOR_PORT:-3000}"
default = true
icon = "play"
